<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Title, description, Open Graph, robots and JSON-LD are generated from js/config.js.
       The static values below are a fallback for link previews (WhatsApp/Facebook don't run JS):
       update them too for a new client. -->
  <title>ויויאן קוסמטיק | קוסמטיקה פרא-רפואית בהרצליה</title>
  <meta name="description" content="בוטיק לקוסמטיקה פרא-רפואית בהרצליה עם מעל 35 שנות ניסיון: אקנה, כתמים, אנטי-אייג'ינג. קביעת תור בוואטסאפ.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="ויויאן קוסמטיק | קוסמטיקה פרא-רפואית בהרצליה">
  <meta property="og:description" content="עור בריא. ביד שמכירה אותו 35 שנה.">
  <meta property="og:image" content="https://benzakenavi25-hub.github.io/vivian-cosmetic-demo/images/hero.png">
  <meta name="theme-color" content="#FBF1EF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2732%27 fill=%27%23D6336C%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Georgia,serif%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EV%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Hero image preload (keep in sync with images.hero in config.js) -->
  <link rel="preload" as="image" href="images/hero.webp" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="css/styles.css?v=2">

  <!-- Apply palette + saved accessibility prefs before first paint (no color flash) -->
  <script src="js/config.js?v=2"></script>
  <script>
    (function () {
      var c = window.SITE_CONFIG || {}, root = document.documentElement;
      var p = c.palette || {};
      try {
        if (new URLSearchParams(location.search).get("themes") === "1") {
          var saved = JSON.parse(sessionStorage.getItem("demoPalette") || "null");
          if (saved) for (var k in saved) p[k] = saved[k];
        }
        var a = JSON.parse(localStorage.getItem("a11yPrefs") || "{}");
        if (a.size) root.style.setProperty("--font-scale", a.size);
        if (a.contrast) root.classList.add("a11y-contrast");
        if (a.links) root.classList.add("a11y-links");
      } catch (e) {}
      var map = { bg: "--bg", rose: "--rose", accent: "--accent", onAccent: "--on-accent", ink: "--ink", inkSoft: "--ink-soft", plum: "--plum" };
      for (var key in map) if (p[key]) root.style.setProperty(map[key], p[key]);
      root.classList.add("js");
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">דלג לתוכן הראשי</a>

  <!-- Smart header: hides on scroll down, returns on scroll up -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="#top" id="header-logo"></a>
      <nav class="main-nav" aria-label="ניווט ראשי"><ul id="nav-list"></ul></nav>
      <a class="btn btn-accent btn-sm header-cta" id="header-cta" target="_blank" rel="noopener">קביעת תור</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="פתיחת תפריט">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Mobile full-screen menu -->
  <div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="תפריט" hidden>
    <nav aria-label="ניווט במובייל"><ul id="mobile-nav-list"></ul></nav>
    <div class="mobile-menu-foot" id="mobile-menu-foot"></div>
  </div>

  <main id="main" tabindex="-1">
    <span id="top"></span>
    <section class="hero tex-a" id="hero" aria-labelledby="hero-title"></section>
    <div class="marquee" id="marquee" aria-hidden="true"></div>
    <section class="section tex-b" id="treatments" aria-labelledby="treatments-title"></section>
    <section class="section tex-c" id="results" aria-labelledby="results-title" hidden></section>
    <section class="section tex-a" id="about" aria-labelledby="about-title"></section>
    <section class="section tex-b" id="testimonials" aria-labelledby="testimonials-title" hidden></section>
    <section class="section dark" id="booking" aria-labelledby="booking-title"></section>
    <section class="section tex-c" id="faq" aria-labelledby="faq-title" hidden></section>
  </main>

  <footer class="site-footer dark" id="site-footer"></footer>

  <!-- Mobile sticky bar / desktop floating WhatsApp -->
  <nav class="mobile-bar" id="mobile-bar" aria-label="פעולות מהירות"></nav>
  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="שליחת הודעה בוואטסאפ"><span data-icon="whatsapp"></span></a>

  <!-- Accessibility toolbar -->
  <div class="a11y" id="a11y">
    <button class="a11y-toggle" id="a11y-toggle" type="button" aria-expanded="false" aria-controls="a11y-panel" aria-label="תפריט נגישות"><span data-icon="a11y"></span></button>
    <div class="a11y-panel" id="a11y-panel" role="group" aria-label="הגדרות נגישות" hidden>
      <p class="a11y-title">נגישות</p>
      <div class="a11y-row">
        <button type="button" data-a11y="smaller" aria-label="הקטנת טקסט">א-</button>
        <button type="button" data-a11y="bigger" aria-label="הגדלת טקסט">א+</button>
      </div>
      <button type="button" data-a11y="contrast" aria-pressed="false">ניגודיות גבוהה</button>
      <button type="button" data-a11y="links" aria-pressed="false">הדגשת קישורים</button>
      <button type="button" data-a11y="reset">איפוס</button>
      <a href="accessibility.html">הצהרת נגישות</a>
    </div>
  </div>

  <!-- Quiz modal (bottom sheet on mobile) -->
  <div class="modal" id="quiz-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="quiz-modal-title" tabindex="-1">
      <button class="modal-close" type="button" data-close-modal aria-label="סגירת השאלון"><span data-icon="close"></span></button>
      <p class="kicker" id="quiz-modal-title"></p>
      <div id="quiz-body" aria-live="polite"></div>
    </div>
  </div>

  <noscript>
    <p class="noscript">ויויאן קוסמטיק · סוקולוב 13, הרצליה · <a href="tel:+972522892431">052-2892431</a></p>
  </noscript>

  <script src="js/main.js?v=2" defer></script>
</body>
</html>
